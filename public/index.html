<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Public Scratchpad</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="layout">
      <section class="card hero">
        <p class="eyebrow">Quick share scratchpad</p>
        <h1>Drop HTML, text, PDF, and scratch files in one place.</h1>
        <p class="lede">
          Upload a file, grab the share link, and preview supported content directly in the browser.
        </p>

        <form id="upload-form" class="upload-form">
          <label class="file-picker" for="scratchFile">
            <span>Select a file</span>
            <input id="scratchFile" name="scratchFile" type="file" required />
          </label>
          <button type="submit">Upload to scratchpad</button>
        </form>

        <p id="status-message" class="status-message" role="status" aria-live="polite"></p>
      </section>

      <section class="card files-card">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Shared files</p>
            <h2>Latest uploads</h2>
          </div>
          <button id="refresh-button" class="secondary-button" type="button">Refresh</button>
        </div>

        <ul id="file-list" class="file-list"></ul>
        <p id="empty-state" class="empty-state">No files yet. Upload your first scratch file.</p>
      </section>

      <section id="preview-panel" class="card preview-card hidden">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Preview</p>
            <h2 id="preview-title">File preview</h2>
          </div>
          <a id="open-link" class="secondary-button link-button" href="/" target="_blank" rel="noreferrer" aria-label="Open file in a new tab">Open</a>
        </div>
        <div id="preview-body" class="preview-body"></div>
      </section>
    </main>

    <script src="/main.js" defer></script>
  </body>
  </html>
